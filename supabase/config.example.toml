# Фрагменты, которые нужно внести в supabase/config.toml после `supabase init`.
# Полный файл генерирует CLI под свою версию - не копируйте этот файл целиком.
# CLI 3.x: секция [inbucket] переименована в [local_smtp]; если CLI сгенерировал
# [inbucket] - переименуйте, иначе `supabase status` и `start` падают.

[db]
major_version = 15

[auth]
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.test_otp]
"244900000001" = "123456"
"244900000002" = "123456"
"244900000003" = "123456"
"244900000004" = "123456"
"244900000005" = "123456"
"244900000099" = "123456"

# CLI 3.x отключает вход по телефону, если не включён ни один SMS-провайдер.
# Заглушка: номера из test_otp до провайдера не доходят. Реальные SMS - через send-sms (I1).
[auth.sms.twilio]
enabled = true
account_sid = "local-dev"
message_service_sid = "local-dev"
auth_token = "local-dev"

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"
